[metadata]
name = bvs-camera
version = 0.1.0
description = Raspberry Pi camera transmitter with adaptive WFB/FEC
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.data_files]
share/bvs-camera/config = config/link.json
